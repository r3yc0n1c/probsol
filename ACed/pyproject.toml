[project]
name = "aced"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Raja Majumdar", email = "raja.majumdar.01@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
aced = "aced.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aced"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"